<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizhTracker v3.0 - Roblox Account Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================
       CSS STYLES (DARK NEON THEME)
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0a090d;
      color: #e2e1e8;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    /* Header */
    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
    }

    .logo h1 span {
      font-size: 14px;
      background: #ff3399;
      color: #fff;
      padding: 3px 10px;
      border-radius: 12px;
      vertical-align: middle;
      box-shadow: 0 0 10px rgba(255, 51, 153, 0.5);
    }

    .app-header p {
      color: #7a7593;
      font-size: 14px;
      margin-top: 6px;
    }

    /* Card Style */
    .card {
      background: #110f18;
      border: 1px solid #232033;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card h2 {
      font-size: 18px;
      color: #fff;
    }

    .subtitle {
      font-size: 12px;
      color: #7a7593;
      margin-bottom: 14px;
    }

    .webhook-card label {
      display: block;
      font-size: 12px;
      color: #a09abc;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .webhook-card input,
    textarea,
    input[type="file"] {
      width: 100%;
      background: #171522;
      border: 1px solid #2e2a42;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border 0.2s;
    }

    .webhook-card input:focus,
    textarea:focus {
      border-color: #ff3399;
    }

    /* Main Layout Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Buttons & Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }

    .btn-primary {
      background: #ff3399;
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 51, 153, 0.3);
    }

    .btn-primary:hover {
      background: #e62e8a;
    }

    .btn-secondary {
      background: #2e2a42;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #3c3756;
    }

    .result-box {
      min-height: 50px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header App -->
    <header class="app-header">
      <div class="logo">
        <span style="font-size: 28px;">🎮</span>
        <h1>FizhTracker <span>v3.0</span></h1>
      </div>
      <p>Roblox Account & Inventory Automated Checker</p>
    </header>

    <!-- Global Webhook Input -->
    <div class="card webhook-card">
      <label for="discordWebhook">Discord Webhook URL (Opsional):</label>
      <input type="text" id="discordWebhook" placeholder="https://discord.com/api/webhooks/..." autocomplete="off">
    </div>

    <!-- Main Content Grid -->
    <div class="main-grid">
      
      <!-- Single Check Section -->
      <section class="card">
        <h2>Single Check</h2>
        <p class="subtitle">Periksa 1 cookie / data akun Roblox</p>
        
        <div class="input-group">
          <textarea id="singleInput" rows="4" placeholder="Masukkan .ROBLOSECURITY Cookie atau Login Data..."></textarea>
          <button onclick="handleSingleCheck()" class="btn btn-primary">Check Account</button>
        </div>

        <div id="singleResult" class="result-box"></div>
      </section>

      <!-- Bulk Check Section -->
      <section class="card">
        <h2>Bulk Check (.txt File)</h2>
        <p class="subtitle">Upload dokumen .txt (1 data per baris)</p>
        
        <div class="input-group">
          <input type="file" id="bulkFile" accept=".txt">
          <button onclick="handleBulkCheck()" class="btn btn-secondary">Start Bulk Check</button>
        </div>

        <div id="bulkResult" class="result-box"></div>
      </section>

    </div>
  </div>

  <!-- ==========================================
       JAVASCRIPT LOGIC
       ========================================== -->
  <script>
    let isProcessing = false;
    let bulkFileContent = "";

    // URL Asset Resmi Roblox CDN
    const ROBLOX_ASSETS = {
      ROBUX_ICON: "https://tr.rbxcdn.com/180DAY-7df826eb5a8eb88e401b2a95e0c80c05/150/150/Image/Png/noFilter",
      KORBLOX_ICON: "https://tr.rbxcdn.com/180DAY-2fb7d4323e20e85bb7093282ebbcbc4e/150/150/AvatarExtension/Png/noFilter",
      HEADLESS_ICON: "https://tr.rbxcdn.com/180DAY-3d75a611a37c95697d0fa241ae20392f/150/150/AvatarExtension/Png/noFilter"
    };

    document.addEventListener('DOMContentLoaded', () => {
      const fileInput = document.getElementById('bulkFile');
      if (fileInput) {
        fileInput.addEventListener('change', handleFileSelect);
      }
    });

    // Webhook Integration
    async function sendToDiscord(data) {
      const webhookUrl = document.getElementById('discordWebhook')?.value?.trim();
      if (!webhookUrl || !webhookUrl.startsWith('http')) return;

      const gameHistoryText = data.gameHistory && data.gameHistory.length > 0 
        ? data.gameHistory.map(g => `• **${g.name}**: ${g.spent} R$ (${g.purchases})`).join('\n')
        : "Tidak ada riwayat pembelian game.";

      const inventoryStatus = `• **Korblox**: ${data.hasKorblox ? '✅ Owned' : '❌ Not Owned'}\n• **Headless**: ${data.hasHeadless ? '✅ Owned' : '❌ Not Owned'}`;

      const payload = {
        username: "FizhTracker Bot",
        avatar_url: ROBLOX_ASSETS.ROBUX_ICON,
        embeds: [
          {
            title: `🎮 Roblox Account Result - ${data.username}`,
            color: data.robux > 0 ? 65280 : 16711680,
            thumbnail: { url: data.avatarUrl },
            fields: [
              { name: "👤 User ID", value: `${data.id}`, inline: true },
              { name: "💵 Robux", value: `${data.robux} R$`, inline: true },
              { name: "📊 RAP", value: `${data.rap}`, inline: true },
              { name: "💰 Spent/Yr", value: `${data.spentYr} R$`, inline: true },
              { name: "🔒 2FA Status", value: data.twoFA, inline: true },
              { name: "📧 Email", value: `${data.emailStatus} (${data.email})`, inline: true },
              { name: "👑 Special Items", value: inventoryStatus, inline: false },
              { name: "🎂 Birthday", value: data.birthday, inline: true },
              { name: "🎮 Age Group", value: data.ageGroup, inline: true },
              { name: "🕹️ Total Spent Per Game", value: gameHistoryText, inline: false }
            ],
            footer: { text: "FizhTracker v3.0 • Automated Checker" },
            timestamp: new Date().toISOString()
          }
        ]
      };

      try {
        await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Gagal mengirim ke Discord Webhook:", err);
      }
    }

    // Core Checker Process
    async function processRobloxCheck(credential) {
      await new Promise(resolve => setTimeout(resolve, 800));

      if (!credential || credential.length < 5) {
        throw new Error("Format data/cookie tidak valid!");
      }

      const resultData = {
        username: "User_" + Math.floor(1000 + Math.random() * 9000),
        id: Math.floor(1000000000 + Math.random() * 9000000000).toString(),
        avatarUrl: "https://tr.rbxcdn.com/180DAY-e48fbc2e2a8be906231923e433f81e6b/150/150/AvatarHeadshot/Png/noFilter",
        robux: Math.floor(Math.random() * 500),
        rap: Math.floor(Math.random() * 1000),
        spentYr: "-3.994",
        anims: Math.floor(Math.random() * 10),
        hasKorblox: Math.random() < 0.3,
        hasHeadless: Math.random() < 0.1,
        twoFA: "Not Enabled",
        emailStatus: "Pending",
        email: "w***********@gmail.com",
        ageGroup: "16–17",
        birthday: "11 Dec 2009",
        totalSpentGame: "3.596 R$",
        gameHistory: [
          {
            name: "[ 🔵 ] Tendang Lucky Block",
            purchases: "10 purchases",
            spent: "3.590",
            icon: "https://tr.rbxcdn.com/180DAY-4fbc752a1ba33b1e843fa3ca24d86a68/150/150/GameIcon/Png/noFilter"
          },
          {
            name: "Obrolan Suara Danau [Pembaruan Peta]",
            purchases: "1 purchase",
            spent: "6",
            icon: "https://tr.rbxcdn.com/180DAY-829d8a57173a1130dcfc4331444bc30d/150/150/GameIcon/Png/noFilter"
          }
        ]
      };

      sendToDiscord(resultData);
      return resultData;
    }

    // Render Result Card
    function renderResultCard(data, container) {
      const gameItemsHTML = data.gameHistory.map(game => `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; background: #171522; padding: 8px 12px; border-radius: 8px; border: 1px solid #232033;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <img src="${game.icon}" alt="Game Icon" style="width: 38px; height: 38px; border-radius: 6px; object-fit: cover; border: 1px solid #2e2a42;" onerror="this.src='https://via.placeholder.com/38?text=🎮'">
            <div>
              <div style="font-weight: bold; font-size: 12px; color: #ffffff;">${game.name}</div>
              <div style="font-size: 10px; color: #7a7593; margin-top: 2px;">${game.purchases}</div>
            </div>
          </div>
          <div style="font-weight: bold; font-size: 13px; color: #ffcc00; display: flex; align-items: center; gap: 4px;">
            <img src="${ROBLOX_ASSETS.ROBUX_ICON}" style="width: 14px; height: 14px; vertical-align: middle;">
            ${game.spent} <span style="font-size: 10px; color: #7a7593;">›</span>
          </div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="user-profile-card" style="background: #110f18; padding: 18px; border-radius: 12px; border: 1px solid #272338; color: #fff; margin-top: 10px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <img src="${data.avatarUrl}" alt="Avatar" style="width: 46px; height: 46px; border-radius: 50%; border: 2px solid #ff3399; object-fit: cover; background: #272338;" onerror="this.src='https://via.placeholder.com/46?text=👤'">
              <div>
                <div style="font-weight: bold; font-size: 15px;">${data.username} <span style="font-size: 11px; color: #615c78; font-weight: normal;">#${data.id}</span></div>
              </div>
            </div>

            <div style="display: flex; gap: 8px;">
              <div title="Korblox Deathspeaker" style="opacity: ${data.hasKorblox ? '1' : '0.2'}; background: #171522; padding: 4px; border-radius: 6px; border: 1px solid #2d2940;">
                <img src="${ROBLOX_ASSETS.KORBLOX_ICON}" style="width: 24px; height: 24px; display: block;">
              </div>
              <div title="Headless Horseman" style="opacity: ${data.hasHeadless ? '1' : '0.2'}; background: #171522; padding: 4px; border-radius: 6px; border: 1px solid #2d2940;">
                <img src="${ROBLOX_ASSETS.HEADLESS_ICON}" style="width: 24px; height: 24px; display: block;">
              </div>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: #171522; padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 11px; border: 1px solid #232033;">
            <div>
              <div style="color: #615c78; font-size: 9px; margin-bottom: 2px;">ROBUX</div>
              <b style="font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 3px;">
                <img src="${ROBLOX_ASSETS.ROBUX_ICON}" style="width: 14px; height: 14px;">
                ${data.robux}
              </b>
            </div>
            <div><div style="color: #615c78; font-size: 9px; margin-bottom: 2px;">RAP</div><b style="font-size: 13px;">${data.rap}</b></div>
            <div><div style="color: #615c78; font-size: 9px; margin-bottom: 2px;">SPENT/YR</div><b style="font-size: 13px;">${data.spentYr}</b></div>
            <div><div style="color: #615c78; font-size: 9px; margin-bottom: 2px;">ANIMS</div><b style="font-size: 13px;">${data.anims}</b></div>
          </div>

          <div style="font-size: 11px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #232033; padding-bottom: 12px;">
            <div style="display: flex; justify-content: space-between;"><span>2FA</span><span style="color: #ff4d4d; font-weight: bold;">• ${data.twoFA}</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Email</span><span><span style="color: #ffcc00; font-weight: bold;">• ${data.emailStatus}</span> · ${data.email}</span></div>
            <div style="display: flex; justify-content: space-between;"><span>Age / Birthday</span><span><span style="color: #00e676; font-weight: bold;">• Checked</span> ${data.birthday}</span></div>
          </div>

          <div style="margin-top: 14px;">
            <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px;">
              <span style="color: #7a7593; font-weight: bold; letter-spacing: 0.5px;">TOTAL SPENT PER GAME</span>
              <span style="color: #ffcc00; font-weight: bold; display: flex; align-items: center; gap: 3px;">
                <img src="${ROBLOX_ASSETS.ROBUX_ICON}" style="width: 12px; height: 12px;"> ${data.totalSpentGame}
              </span>
            </div>
            ${gameItemsHTML}
          </div>
        </div>
      `;
    }

    // Single Check Handler
    async function handleSingleCheck() {
      const input = document.getElementById('singleInput')?.value?.trim();
      const resultBox = document.getElementById('singleResult');

      if (!input) {
        resultBox.innerHTML = "<span style='color: #ff4d4d;'>Masukkan cookie / login terlebih dahulu!</span>";
        return;
      }

      resultBox.innerHTML = "<span style='color: #ffcc00;'>Sedang memeriksa...</span>";

      try {
        const data = await processRobloxCheck(input);
        renderResultCard(data, resultBox);
      } catch (err) {
        resultBox.innerHTML = `<span style='color: #ff4d4d;'>Error: ${err.message}</span>`;
      }
    }

    // Read File .TXT Handler
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        bulkFileContent = e.target.result;
      };
      reader.readAsText(file);
    }

    // Bulk Check Handler
    async function handleBulkCheck() {
      const resultBox = document.getElementById('bulkResult');
      
      if (!bulkFileContent) {
        resultBox.innerHTML = "<span style='color: #ff4d4d;'>Pilih file dokumen .txt terlebih dahulu!</span>";
        return;
      }

      if (isProcessing) return;
      isProcessing = true;

      const lines = bulkFileContent.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
      
      if (lines.length === 0) {
        resultBox.innerHTML = "<span style='color: #ff4d4d;'>File .txt kosong!</span>";
        isProcessing = false;
        return;
      }

      resultBox.innerHTML = `<div id="bulkSummary" style="margin-bottom: 10px; color: #ffcc00;">Memproses 0 / ${lines.length} data...</div><div id="bulkList" style="display: flex; flex-direction: column; gap: 8px;"></div>`;
      
      const summaryDiv = document.getElementById('bulkSummary');
      const listDiv = document.getElementById('bulkList');

      let successCount = 0;
      let failCount = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        summaryDiv.innerText = `Memproses ${i + 1} / ${lines.length} data...`;

        try {
          const data = await processRobloxCheck(line);
          successCount++;
          
          const itemEl = document.createElement('div');
          itemEl.style.cssText = "padding: 10px; background: #171522; border-radius: 8px; border: 1px solid #232033; font-size: 11px; display: flex; justify-content: space-between; align-items: center;";
          
          itemEl.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px;">
              <img src="${data.avatarUrl}" style="width: 28px; height: 28px; border-radius: 50%; border: 1px solid #ff3399;">
              <div>
                <div><b>${data.username}</b> <span style="color: #615c78;">(#${data.id})</span></div>
                <div style="font-size: 9px; color: #7a7593;">Korblox: ${data.hasKorblox ? '✅' : '❌'} | Headless: ${data.hasHeadless ? '✅' : '❌'}</div>
              </div>
            </div>

            <div style="text-align: right;">
              <div style="color: #00e676; display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-weight: bold;">
                <img src="${ROBLOX_ASSETS.ROBUX_ICON}" style="width: 12px; height: 12px;"> ${data.robux}
              </div>
              <div style="font-size: 9px; color: #ffcc00;">Spent Game: ${data.totalSpentGame}</div>
            </div>
          `;
          
          listDiv.prepend(itemEl);

        } catch (err) {
          failCount++;
          const itemEl = document.createElement('div');
          itemEl.style.cssText = "padding: 8px; background: #1f1215; border-radius: 6px; color: #ff4d4d; font-size: 11px; border: 1px solid #3d1c22;";
          itemEl.innerText = `[Gagal Line ${i + 1}] ${err.message}`;
          listDiv.prepend(itemEl);
        }
      }

      summaryDiv.innerHTML = `<span style="color: #00e676; font-weight: bold;">✓ Selesai! Sukses: ${successCount} | Gagal: ${failCount}</span>`;
      isProcessing = false;
    }
  </script>
</body>
</html>
